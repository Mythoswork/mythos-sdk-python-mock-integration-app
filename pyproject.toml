[project]
name = "mythos-calculator-mockup-python"
version = "0.0.1"
description = "Python (FastAPI) Producer-role harness exercising mythos-sdk end-to-end"
requires-python = ">=3.11"
dependencies = [
    "mythos-sdk[fastapi]>=0.0.7",
    "fastapi[standard]>=0.100.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
bypass-selection = true
